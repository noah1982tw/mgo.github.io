    }

      text-align: center;
      background-color: #f1faee;
      color: #1d3557;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 1px solid #a8dadc;
      transition: background 0.2s, color 0.2s;
    }
    .map-btn:hover {
      background-color: #a8dadc;
    }
    .map-btn.disabled {
      background-color: #f5f5f5;
      color: #aaa;
      border-color: #ddd;
      cursor: not-allowed;
      pointer-events: none;
    }

    // 直接使用原始碼中的 defaultRestaurants 作為統一資料來源
    const restaurants = defaultRestaurants;

    // 頁面初次載入
    document.addEventListener("DOMContentLoaded", () => {
      renderList(restaurants);
    });

    // 渲染卡片清單與總數更新
    function renderList(dataList) {
      const listElement = document.getElementById('restaurant-list');
      const countElement = document.getElementById('total-count');
      
      // 更新數量統計
      countElement.textContent = dataList.length;

      if (dataList.length === 0) {
        listElement.innerHTML = '<div class="empty-msg">找不到符合關鍵字的餐廳</div>';
        return;
      }

      // 產生卡片結構
      listElement.innerHTML = dataList.map(item => {
        const hasMap = item.mapUrl && item.mapUrl.trim() !== "";
        return `
          <div class="card">
            <div>
              <div class="card-title">${escapeHtml(item.name)}</div>
              <div class="card-address">📍 ${escapeHtml(item.address)}</div>
            </div>
            ${
              hasMap 
                ? `<a class="map-btn" href="${escapeHtml(item.mapUrl)}" target="_blank" rel="noopener noreferrer">🗺️ 在 Google Map 開啟</a>`
                : `<span class="map-btn disabled">無地圖連結</span>`
            }
          </div>
        `;
      }).join('');
    }

    // 搜尋過濾功能 (支援名稱與地址即時模糊比對)
    function handleSearch() {
      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-btn');
      const keyword = searchInput.value.toLowerCase().trim();

      // 控制 (X) 清除按鈕顯示狀態
      clearBtn.style.display = keyword ? 'block' : 'none';

      const filtered = restaurants.filter(item => 
        (item.name && item.name.toLowerCase().includes(keyword)) || 
        (item.address && item.address.toLowerCase().includes(keyword))
      );

      renderList(filtered);
    }

    // 清除搜尋關鍵字
    function clearSearch() {
      const searchInput = document.getElementById('search-input');
      searchInput.value = '';
      handleSearch();
      searchInput.focus();
    }

    // HTML 特殊字元轉義 (維護網頁安全性)
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
